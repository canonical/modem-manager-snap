snapcraft-version: 8.14.4
snapcraft-started-at: '2026-04-08T14:43:53.533718Z'
snapcraft-os-release-id: ubuntu
snapcraft-os-release-version-id: '26.04'
name: modem-manager
version: 1.25.95-1
summary: ModemManager is a service which controls mobile broadband
description: |
  ModemManager is a DBus-activated daemon which controls mobile broadband
  (2G/3G/4G) devices and connections. Whether built-in devices, USB dongles,
  bluetooth-paired telephones or professional RS232/USB devices with external
  power supplies, ModemManager is able to prepare and configure the modems and
  setup connections with them.
  Please find the source code at
  https://github.com/snapcore/modem-manager-snap/tree/snap-26
base: core26
grade: devel
confinement: strict
apps:
  mmcli:
    command: bin/mmcli
    plugs:
    - mmcli
  modemmanager:
    command: bin/modemmanager
    daemon: simple
    slots:
    - service
  mbimcli:
    command: usr/bin/mbimcli
    slots:
    - service
  mbim-network:
    command: usr/bin/mbim-network
    slots:
    - service
  qmicli:
    command: usr/bin/qmicli
    slots:
    - service
  qmi-network:
    command: usr/bin/qmi-network
    slots:
    - service
parts:
  modemmanager-hooks:
    plugin: dump
    source: hooks
    organize:
      configure: meta/hooks/configure
    stage-packages: []
    stage: []
    prime: []
    build-packages: []
  modemmanager-bin:
    plugin: dump
    source: bin
    organize:
      modemmanager: bin/modemmanager
      mmcli: bin/mmcli
      mmcli-internal: bin/mmcli-internal
    stage-packages: []
    stage: []
    prime: []
    build-packages: []
  changelog:
    plugin: nil
    override-build: 'cp "/build/modem-manager"/ChangeLog "$CRAFT_PART_INSTALL"

      '
    organize:
      ChangeLog: snap/ChangeLog
    stage-packages: []
    stage: []
    prime: []
    build-packages: []
  stack-snaps-tools:
    plugin: nil
    source: https://git.launchpad.net/~snappy-hwe-team/snappy-hwe-snaps/+git/stack-snaps-tools
    source-type: git
    build-packages:
    - dpkg-dev
    - git
    stage-packages:
    - base-files=14ubuntu5
    - dbus-bin=1.16.2-2ubuntu4
    - dbus-daemon=1.16.2-2ubuntu4
    - dbus-session-bus-common=1.16.2-2ubuntu4
    - dbus-system-bus-common=1.16.2-2ubuntu4
    - dbus=1.16.2-2ubuntu4
    - debconf=1.5.92
    - gcc-16-base=16-20260322-1ubuntu1
    - libacl1=2.3.2-2
    - libapparmor1=5.0.0~beta1-0ubuntu5
    - libatomic1=16-20260322-1ubuntu1
    - libaudit-common=1:4.1.2-1build1
    - libaudit1=1:4.1.2-1build1
    - libc-gconv-modules-extra=2.43-2ubuntu1
    - libcap-ng0=0.8.5-4build5
    - libdb5.3t64=5.3.28+dfsg2-10ubuntu1
