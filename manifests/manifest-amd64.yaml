    - bash-completion
    - systemd-dev
    stage-packages:
    - gcc-16-base=16-20260322-1ubuntu1
    - libatomic1=16-20260322-1ubuntu1
    - libc-gconv-modules-extra=2.43-2ubuntu1
    - libffi8=3.5.2-3
    - libglib2.0-0t64=2.88.0-1
    - libgudev-1.0-0=1:238-7build1
    - libmbim-glib4=1.32.0-2ubuntu1
    - libmbim-proxy=1.32.0-2ubuntu1
    - libmbim-utils=1.32.0-2ubuntu1
    - libqmi-glib5=1.38.0-1
    - libqmi-proxy=1.38.0-1
    - libqmi-utils=1.38.0-1
    - libqrtr-glib0=1.2.2-2ubuntu1
    override-build: |
      set -ex
      cd "$CRAFT_PART_SRC"
      # TODO uncomment this, failing until git repo and deb package are synced with each other
      #"/build/modem-manager/stage"/build-tools/check-versions modemmanager
      # Apply snap related patches
      git config user.email "snapcraft@canonical.com"
      git config user.name "snapcraft"
      git am "/build/modem-manager"/patch/*.patch
      cd "$CRAFT_PART_BUILD"
      craftctl default
      # Run all tests ModemManager ships by default
      ninja test
      # Strip binaries
      find "$CRAFT_PART_INSTALL"/ -executable -type f | xargs file -Ni |
          grep 'application/x-.*executable\|application/x-.*sharedlib' | cut -d: -f1 | xargs strip
    prime:
    - usr/bin/mmcli
    - usr/sbin/ModemManager
    - usr/lib/ModemManager/*so
    - usr/lib/*/libgudev-1.0.so*
    - usr/lib/libmm-glib.so*
    - usr/share/doc/libgudev-1.0-0
    - usr/lib/*/libmbim-glib.so*
    - usr/lib/*/libqrtr-glib.so*
    - usr/bin/mbimcli
    - usr/bin/mbim-network
    - usr/share/doc/libmbim-glib4
    - usr/share/doc/libmbim-proxy
    - usr/share/doc/libmbim-utils
    - usr/lib/*/libqmi-glib.so*
    - usr/bin/qmicli
    - usr/bin/qmi-firmware-update
    - usr/bin/qmi-network
    - usr/share/doc/libqmi-glib5
    - usr/share/doc/libqmi-proxy
    - usr/share/doc/libqmi-utils
    - usr/libexec/*
    stage: []
